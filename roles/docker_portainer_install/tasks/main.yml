---
- name: Installer Docker et Docker Compose
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present
    update_cache: true

- name: Démarrer Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ajouter devops au groupe docker
  ansible.builtin.user:
    name: devops
    groups: docker
    append: true
